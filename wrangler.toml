name = "endoflife-mcp"
main = "src/index.js"
compatibility_date = "2024-09-23"
workers_dev = true

# NOTE: the custom domain route lives under [env.production] below so that a
# plain `wrangler deploy` goes ONLY to the workers.dev test URL (no DNS needed).
# Add the `mcp` DNS record (see README), then `wrangler deploy --env production`.

[env.production]
name = "endoflife-mcp-prod"
route = { pattern = "mcp.endoflife.ai/*", zone_name = "endoflife.ai" }

# No KV / secrets needed for Phase 1 — the Worker calls the public
# api.endoflife.ai endpoints and forwards any X-API-Key the caller sends.

# api.endoflife.ai is a Worker on this same zone, so a normal fetch() to it is
# sent to origin rather than back through Workers (and there is no origin) —
# every tool call failed with an upstream error. Bind the API Worker directly.
[[services]]
binding = "API"
service = "endoflife-api"

[[env.production.services]]
binding = "API"
service = "endoflife-api"

# Usage telemetry (1.1.0): one data point per MCP method / tool call — tool
# name, client user agent, ok/error, keyed/anon, latency. Query with the
# Analytics Engine SQL API (dataset endoflife_mcp_usage). Optional: the code
# no-ops when the binding is absent (wrangler dev without it, the stdio bridge).
[[analytics_engine_datasets]]
binding = "USAGE"
dataset = "endoflife_mcp_usage"

[[env.production.analytics_engine_datasets]]
binding = "USAGE"
dataset = "endoflife_mcp_usage"
